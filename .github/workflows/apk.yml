# Genera la app Android (APK) a partir de la web y la publica en "Releases" (gratis).
# Ejecútalo a mano: pestaña Actions > "Crear APK" > Run workflow.
name: Crear APK
on:
  workflow_dispatch:
    inputs:
      nombre_app:
        description: 'Nombre que se verá bajo el ícono (ej: Mi Delivery)'
        default: 'App Negocio'
      url_api:
        description: 'URL /exec del Apps Script de ESTE negocio (vacío = la de web/public/config.json)'
        default: ''
      id_app:
        description: 'ID único de la app, minúsculas y puntos (ej: cl.minegocio.delivery). No lo cambies después.'
        default: 'cl.corniog.negocio'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Personalizar (nombre, ID y servidor de este negocio)
        working-directory: web
        env:
          NOMBRE: ${{ inputs.nombre_app }}
          URL: ${{ inputs.url_api }}
          IDAPP: ${{ inputs.id_app }}
        run: |
          pip install pillow
          python3 - <<'PY'
          import json, os, re
          nombre = os.environ.get('NOMBRE', '').strip() or 'App Negocio'
          idapp = os.environ.get('IDAPP', '').strip() or 'cl.corniog.negocio'
          if not re.fullmatch(r'[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+', idapp):
              raise SystemExit('ID de app inválido: ' + idapp)
          c = json.load(open('capacitor.config.json'))
          c['appName'] = nombre; c['appId'] = idapp
          json.dump(c, open('capacitor.config.json', 'w'), ensure_ascii=False, indent=2)
          url = os.environ.get('URL', '').strip()
          if url:
              json.dump({'API_URL': url}, open('public/config.json', 'w'), indent=2)
          open(os.environ['GITHUB_ENV'], 'a').write('VITE_APP_NAME=' + nombre + '\n')
          # Ícono propio del negocio: sube iconos/<ID de la app>.png (cuadrado, mín. 512x512) al repo
          from PIL import Image
          ico = '../iconos/' + idapp + '.png'
          if os.path.exists(ico):
              im = Image.open(ico).convert('RGBA')
              if im.width != im.height:  # cuadrar sin recortar: centrada sobre el color de su esquina
                  side = max(im.size); bg = im.getpixel((0, 0))
                  if bg[3] < 255: bg = (255, 255, 255, 255)
                  c = Image.new('RGBA', (side, side), bg); c.paste(im, ((side - im.width) // 2, (side - im.height) // 2), im); im = c
              im.resize((512, 512), Image.LANCZOS).save('public/icon-512.png')
              im.resize((192, 192), Image.LANCZOS).save('public/icon-192.png')
              print('Usando ícono propio:', ico)
          PY
      - name: Compilar la web
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Crear proyecto Android
        working-directory: web
        run: |
          npx cap add android
          # Permisos: ubicación (mapa en vivo) y cámara (escáner de códigos de barras)
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          extra = ('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
                   '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
                   '    <uses-permission android:name="android.permission.CAMERA" />\n'
                   '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                   '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n')
          s = s.replace('</manifest>', extra + '</manifest>')
          open(p, 'w').write(s)
          PY
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Íconos de la app
        run: |
          pip install pillow
          python3 tools/android_icons.py web/android/app/src/main/res web/public/icon-512.png
      - name: Compilar APK
        working-directory: web
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar el APK
        run: cp web/android/app/build/outputs/apk/debug/app-debug.apk app-negocio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-negocio-apk
          path: app-negocio.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest app-negocio.apk --title "App Android (APK)" \
            --notes "Descarga **app-negocio.apk** desde tu celular e instálalo (permite 'instalar apps desconocidas'). Versión ${{ github.run_number }}."
